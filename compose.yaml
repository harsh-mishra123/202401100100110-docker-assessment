services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - festpass-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: harrsshhh/fest-backend:1.0.0
    environment:
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${DB_PASSWORD}
      REGNO: "202401100100110"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8010:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-net

# frontend <-> backend on frontend-net, backend <-> db on backend-net:
# the frontend has no route to the database.
networks:
  frontend-net:
  backend-net:

volumes:
  festpass-data:
